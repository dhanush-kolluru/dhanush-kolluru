<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Stock Analysis Dashboard</h1>
    <form method="post">
        <input type="text" name="ticker" placeholder="Enter stock name" required>
        <button type="submit">Analyze</button>
    </form>
    <div id="stock-data">
        {% if plot_url %}
            <img src="{{ plot_url }}" alt="Stock Analysis Plot">
        {% endif %}
    </div>
</body>
</html>
